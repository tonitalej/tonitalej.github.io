<footer class="site-footer">
  <div class="container footer-inner">
    <p>
      © {{ now.Year }} {{ site.Title }}
    </p>
    <ul class="socials socials-small" aria-label="Elsewhere">
      {{- range site.Data.socials }}
        <li>
          <a href="{{ .link }}" aria-label="{{ .name }}" title="{{ .name }}" {{ if hasPrefix .link "http" }}target="_blank" rel="noopener noreferrer"{{ end }}>
            {{ partial "icon.html" .icon }}
          </a>
        </li>
      {{- end }}
    </ul>
  </div>
</footer>
